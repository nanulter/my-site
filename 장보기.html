<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #FFF5F8;
    --card: #FFFFFF;
    --pink: #F7A8C4;
    --pink-dark: #E77FA6;
    --pink-soft: #FDE4EE;
    --text: #444444;
    --muted: #A8A0A4;
    --line: #F6D9E4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    text-align: center;
    font-size: 28px;
    margin: 8px 0 20px;
    color: var(--pink-dark);
  }
  .add {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--card);
    padding: 14px;
    border-radius: 20px;
    box-shadow: 0 4px 14px rgba(231, 127, 166, 0.12);
    margin-bottom: 20px;
  }
  .add input, .add select {
    font: inherit;
    padding: 10px 12px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    min-width: 0;
  }
  .add input { flex: 1 1 180px; }
  .add select { flex: 0 1 auto; }
  .add input:focus, .add select:focus { outline: none; border-color: var(--pink); }
  button {
    font: inherit;
    border: none;
    border-radius: 14px;
    padding: 10px 18px;
    background: var(--pink);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: var(--pink-dark); }
  .group {
    background: var(--card);
    border-radius: 20px;
    padding: 14px 16px 8px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(231, 127, 166, 0.12);
  }
  .group h2 {
    font-size: 19px;
    margin: 0 0 6px;
    padding-bottom: 8px;
    border-bottom: 2px dashed var(--line);
  }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .group li label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    cursor: pointer;
    border-radius: 12px;
  }
  .group li label:hover { background: var(--pink-soft); }
  .group li + li { border-top: 1px solid #FBEFF4; }
  input[type="checkbox"] {
    appearance: none;
    width: 26px; height: 26px;
    flex: none;
    border: 2px solid var(--pink);
    border-radius: 8px;
    background: #fff;
    display: grid;
    place-content: center;
    cursor: pointer;
    margin: 0;
  }
  input[type="checkbox"]:checked { background: var(--pink); }
  input[type="checkbox"]:checked::after {
    content: "✓";
    color: #fff;
    font-weight: bold;
    font-size: 17px;
  }
  li.done span { color: var(--muted); text-decoration: line-through; }
  .empty { color: var(--muted); font-size: 15px; padding: 8px 4px 12px; }
  .bottom { text-align: center; margin-top: 24px; }
  .reset {
    background: #fff;
    color: var(--pink-dark);
    border: 2px solid var(--pink);
  }
  .reset:hover { background: var(--pink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 우리 집 장보기</h1>

  <form class="add" id="addForm">
    <input id="nameInput" type="text" placeholder="살 것을 적어 주세요" autocomplete="off" required>
    <select id="catSelect"></select>
    <button type="submit">추가</button>
  </form>

  <div id="list"></div>

  <div class="bottom">
    <button class="reset" id="resetBtn" type="button">🔄 체크 모두 풀기</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "our-home-grocery-list-v1";

  const CATEGORIES = [
    { id: "veg",   name: "🥬 채소·과일" },
    { id: "meat",  name: "🥩 고기·생선" },
    { id: "dairy", name: "🥛 유제품·계란" },
    { id: "food",  name: "🍚 가공식품·양념" },
    { id: "life",  name: "🧻 생활용품" }
  ];

  const DEFAULT_ITEMS = [
    ["양파", "veg"], ["대파", "veg"], ["사과", "veg"],
    ["돼지고기", "meat"],
    ["계란", "dairy"], ["우유", "dairy"], ["두부", "dairy"],
    ["라면", "food"], ["간장", "food"],
    ["휴지", "life"], ["세제", "life"]
  ];

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) { /* 저장소를 못 쓰면 기본 목록으로 시작 */ }
    return DEFAULT_ITEMS.map(([name, cat]) => ({ id: makeId(), name, cat, done: false }));
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) { /* 저장 실패 시 무시 */ }
  }

  let items = load();

  const listEl = document.getElementById("list");
  const form = document.getElementById("addForm");
  const nameInput = document.getElementById("nameInput");
  const catSelect = document.getElementById("catSelect");
  const resetBtn = document.getElementById("resetBtn");

  CATEGORIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    catSelect.appendChild(opt);
  });

  function render() {
    listEl.innerHTML = "";
    CATEGORIES.forEach(cat => {
      const inCat = items.filter(it => it.cat === cat.id);
      // 안 산 것 먼저, 체크한 것은 아래로 (각각 추가한 순서 유지)
      const sorted = inCat.filter(it => !it.done).concat(inCat.filter(it => it.done));

      const section = document.createElement("section");
      section.className = "group";
      const h2 = document.createElement("h2");
      h2.textContent = cat.name;
      section.appendChild(h2);

      if (sorted.length === 0) {
        const p = document.createElement("div");
        p.className = "empty";
        p.textContent = "아직 항목이 없어요";
        section.appendChild(p);
      } else {
        const ul = document.createElement("ul");
        sorted.forEach(it => {
          const li = document.createElement("li");
          if (it.done) li.className = "done";
          const label = document.createElement("label");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = it.done;
          cb.addEventListener("change", () => {
            it.done = cb.checked;
            save();
            render();
          });
          const span = document.createElement("span");
          span.textContent = it.name;
          label.appendChild(cb);
          label.appendChild(span);
          li.appendChild(label);
          ul.appendChild(li);
        });
        section.appendChild(ul);
      }
      listEl.appendChild(section);
    });
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    items.push({ id: makeId(), name, cat: catSelect.value, done: false });
    save();
    render();
    nameInput.value = "";
    nameInput.focus();
  });

  resetBtn.addEventListener("click", () => {
    if (!items.some(it => it.done)) {
      alert("체크된 항목이 없어요.");
      return;
    }
    if (confirm("체크를 모두 풀까요?")) {
      items.forEach(it => { it.done = false; });
      save();
      render();
    }
  });

  save();
  render();
</script>
</body>
</html>
